<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Segoe Print','Bradley Hand','Comic Sans MS','Patrick Hand',cursive" role="img" aria-label="From hello to trusted teammate: intake and trust, scouting engine, human control">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e2a44"/>
    </marker>
    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf6d8"/><stop offset="0.5" stop-color="#fde8dc"/><stop offset="1" stop-color="#fadde2"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ece4f7"/><stop offset="0.5" stop-color="#fbe0ee"/><stop offset="1" stop-color="#fde9e2"/>
    </linearGradient>
    <linearGradient id="band3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2f3e4"/><stop offset="0.5" stop-color="#e9f6ef"/><stop offset="1" stop-color="#dff0ec"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#fbfaf4"/>

  <!-- title -->
  <text x="75" y="72" font-size="46" font-weight="bold" fill="#1e2a44">From &#8220;hello&#8221; to trusted teammate</text>
  <text x="78" y="112" font-size="24" fill="#7f8ba8">A traceable path with safety gates, controlled trials, and human authority.</text>

  <!-- robot mascot -->
  <g stroke="#1e2a44" stroke-width="3" fill="none">
    <rect x="1390" y="52" width="90" height="62" rx="16" fill="#ffffff"/>
    <line x1="1408" y1="52" x2="1400" y2="34"/><line x1="1462" y1="52" x2="1470" y2="34"/>
    <circle cx="1418" cy="76" r="4" fill="#1e2a44"/><circle cx="1452" cy="76" r="4" fill="#1e2a44"/>
    <path d="M1416 94 q19 12 38 0"/>
  </g>
  <text x="1492" y="86" font-size="19" fill="#54607c">let's scout!</text>

  <!-- ===================== BAND 1 : INTAKE & TRUST ===================== -->
  <rect x="40" y="148" width="1520" height="292" rx="8" fill="url(#band1)"/>
  <line x1="60" y1="172" x2="1545" y2="172" stroke="#9aa4bd" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="62" y="150" width="188" height="40" rx="20" fill="#fdf6d8" stroke="#1e2a44" stroke-width="3"/>
  <text x="156" y="178" font-size="21" font-weight="bold" letter-spacing="2" fill="#1e2a44" text-anchor="middle">INTAKE &amp; TRUST</text>

  <!-- 1. Registration -->
  <g>
    <rect x="82" y="226" width="252" height="176" rx="6" fill="#fffdf6" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="104" y="270" font-size="26" font-weight="bold" fill="#1e2a44">1. Registration</text>
    <text x="104" y="304" font-size="18" fill="#3d4a66">name &#183; description</text>
    <text x="104" y="329" font-size="18" fill="#3d4a66">categories &#183; owner</text>
    <text x="104" y="354" font-size="18" fill="#3d4a66">semver &#183; content hash</text>
    <g stroke="#1e2a44" stroke-width="2.5" fill="#fff">
      <rect x="276" y="362" width="44" height="32" rx="8"/>
      <circle cx="290" cy="373" r="2.4" fill="#1e2a44"/><circle cx="306" cy="373" r="2.4" fill="#1e2a44"/>
      <path d="M289 384 q9 6 18 0" fill="none"/>
    </g>
  </g>
  <line x1="340" y1="312" x2="378" y2="312" stroke="#1e2a44" stroke-width="5" marker-end="url(#arr)"/>

  <!-- 2. Safety gate -->
  <g>
    <rect x="388" y="226" width="254" height="176" rx="6" fill="#fffdf6" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="410" y="270" font-size="26" font-weight="bold" fill="#1e2a44">2. Safety gate</text>
    <text x="410" y="304" font-size="18" fill="#3d4a66">prompt-injection scan</text>
    <text x="410" y="329" font-size="18" fill="#3d4a66">secrets scan &#183; sandbox</text>
    <text x="410" y="354" font-size="18" fill="#3d4a66">OIDC + provenance</text>
    <g stroke="#1e2a44" stroke-width="2.5" fill="none">
      <path d="M598 356 q16 -7 32 0 v16 q0 16 -16 23 q-16 -7 -16 -23 z" fill="#fff"/>
      <circle cx="609" cy="370" r="2" fill="#1e2a44"/><circle cx="619" cy="370" r="2" fill="#1e2a44"/>
      <path d="M609 379 q5 4 10 0"/>
    </g>
  </g>
  <line x1="648" y1="312" x2="686" y2="312" stroke="#1e2a44" stroke-width="5" marker-end="url(#arr)"/>

  <!-- 3. Registry -->
  <g>
    <rect x="696" y="226" width="260" height="176" rx="6" fill="#fffdf6" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="718" y="270" font-size="26" font-weight="bold" fill="#1e2a44">3. Registry</text>
    <text x="718" y="304" font-size="18" fill="#3d4a66">immutable skill ID</text>
    <text x="718" y="329" font-size="18" fill="#3d4a66">version + owner history</text>
    <text x="718" y="354" font-size="18" fill="#3d4a66">Candidate trust tier</text>
    <g stroke="#1e2a44" stroke-width="2.5" fill="#fff">
      <path d="M897 366 v22 a15 6 0 0 0 30 0 v-22"/>
      <ellipse cx="912" cy="366" rx="15" ry="6"/>
      <circle cx="906" cy="380" r="2" fill="#1e2a44"/><circle cx="918" cy="380" r="2" fill="#1e2a44"/>
      <path d="M906 388 q6 4 12 0" fill="none"/>
    </g>
  </g>
  <line x1="962" y1="312" x2="1000" y2="312" stroke="#1e2a44" stroke-width="5" marker-end="url(#arr)"/>

  <!-- 4. Discovery index -->
  <g>
    <rect x="1010" y="226" width="312" height="176" rx="6" fill="#fffdf6" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="1032" y="270" font-size="26" font-weight="bold" fill="#1e2a44">4. Discovery index</text>
    <text x="1032" y="304" font-size="18" fill="#3d4a66">semantic match + tags</text>
    <text x="1032" y="329" font-size="18" fill="#3d4a66">top-3 overlap warning</text>
    <text x="1032" y="354" font-size="18" fill="#3d4a66">freshness + trust signals</text>
    <g stroke="#1e2a44" stroke-width="2.5" fill="none">
      <circle cx="1266" cy="366" r="15" fill="#fff"/>
      <path d="M1277 377 l13 13" stroke-width="4"/>
      <path d="M1266 358 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1 z" fill="#f5c53c" stroke="#c79a18" stroke-width="1.5"/>
    </g>
  </g>

  <!-- sticky note -->
  <g transform="rotate(4 1500 250)">
    <rect x="1448" y="200" width="104" height="100" rx="3" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/>
    <text x="1500" y="232" font-size="16" fill="#3d4a66" text-anchor="middle">No skill</text>
    <text x="1500" y="254" font-size="16" fill="#3d4a66" text-anchor="middle">jumps the</text>
    <text x="1500" y="276" font-size="16" fill="#3d4a66" text-anchor="middle">queue!</text>
  </g>

  <!-- drop from band 1 to band 2 -->
  <path d="M1200 404 q24 60 -56 84" fill="none" stroke="#1e2a44" stroke-width="6" marker-end="url(#arr)"/>

  <!-- ===================== BAND 2 : SCOUTING ENGINE ===================== -->
  <rect x="40" y="448" width="1520" height="258" rx="8" fill="url(#band2)"/>
  <line x1="60" y1="472" x2="1545" y2="472" stroke="#9aa4bd" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="62" y="450" width="204" height="40" rx="20" fill="#ece4f7" stroke="#1e2a44" stroke-width="3"/>
  <text x="164" y="478" font-size="21" font-weight="bold" letter-spacing="2" fill="#1e2a44" text-anchor="middle">SCOUTING ENGINE</text>

  <!-- 5. Task matcher -->
  <g>
    <rect x="82" y="518" width="280" height="164" rx="6" fill="#fffdfb" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="104" y="560" font-size="26" font-weight="bold" fill="#1e2a44">5. Task matcher</text>
    <text x="104" y="594" font-size="18" fill="#3d4a66">task &#8594; best candidate pair</text>
    <text x="104" y="619" font-size="18" fill="#3d4a66">exact versions are pinned</text>
    <text x="104" y="644" font-size="18" fill="#3d4a66">one shared trial recipe</text>
    <g stroke="#1e2a44" stroke-width="2.5" fill="#fff">
      <circle cx="322" cy="636" r="18"/>
      <line x1="322" y1="618" x2="322" y2="654"/>
      <text x="322" y="643" font-size="15" fill="#1e2a44" text-anchor="middle" stroke="none">AB</text>
    </g>
  </g>
  <line x1="374" y1="600" x2="440" y2="600" stroke="#1e2a44" stroke-width="5" marker-end="url(#arr)"/>

  <!-- 6. Sandboxed A/B arena -->
  <g>
    <rect x="452" y="512" width="392" height="176" rx="6" fill="#fffdfb" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="648" y="552" font-size="26" font-weight="bold" fill="#1e2a44" text-anchor="middle">6. Sandboxed A/B arena</text>
    <g stroke="#1e2a44" stroke-width="3" fill="#fff">
      <rect x="492" y="574" width="110" height="62" rx="16"/>
      <circle cx="530" cy="597" r="3.5" fill="#1e2a44"/><circle cx="564" cy="597" r="3.5" fill="#1e2a44"/>
      <path d="M528 612 q19 12 38 0" fill="none"/>
      <rect x="694" y="574" width="110" height="62" rx="16"/>
      <circle cx="732" cy="597" r="3.5" fill="#1e2a44"/><circle cx="766" cy="597" r="3.5" fill="#1e2a44"/>
      <path d="M730 612 q19 12 38 0" fill="none"/>
    </g>
    <text x="648" y="612" font-size="22" font-weight="bold" fill="#1e2a44" text-anchor="middle">vs</text>
    <text x="547" y="668" font-size="17" fill="#54607c" text-anchor="middle">Skill A</text>
    <text x="749" y="668" font-size="17" fill="#54607c" text-anchor="middle">Skill B</text>
  </g>
  <line x1="856" y1="600" x2="922" y2="600" stroke="#1e2a44" stroke-width="5" marker-end="url(#arr)"/>

  <!-- 7. Evidence log -->
  <g>
    <rect x="934" y="518" width="310" height="164" rx="6" fill="#fffdfb" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="956" y="560" font-size="26" font-weight="bold" fill="#1e2a44">7. Evidence log</text>
    <text x="956" y="594" font-size="18" fill="#3d4a66">pass &#183; latency &#183; tokens &#183; cost</text>
    <text x="956" y="619" font-size="18" fill="#3d4a66">artifacts + qualitative notes</text>
    <text x="956" y="644" font-size="18" fill="#3d4a66">append-only, never rewritten</text>
    <g stroke="#1e2a44" stroke-width="2.5" fill="#fff">
      <path d="M1188 598 l6 62 h26 l6 -62 z"/>
      <path d="M1194 636 l8 -8 6 8 8 -12 6 8" stroke="#3aa06b" fill="none"/>
      <circle cx="1203" cy="648" r="1.8" fill="#1e2a44"/><circle cx="1215" cy="648" r="1.8" fill="#1e2a44"/>
      <path d="M1203 654 q6 4 12 0" fill="none"/>
    </g>
  </g>
  <line x1="1256" y1="600" x2="1318" y2="600" stroke="#1e2a44" stroke-width="5" marker-end="url(#arr)"/>

  <!-- Dossier -->
  <g>
    <rect x="1330" y="524" width="196" height="152" rx="6" fill="#eef6fb" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="1352" y="564" font-size="25" font-weight="bold" fill="#1e2a44">Dossier</text>
    <text x="1352" y="596" font-size="18" fill="#3d4a66">results</text>
    <text x="1352" y="621" font-size="18" fill="#3d4a66">version diff</text>
    <text x="1352" y="646" font-size="18" fill="#3d4a66">trust history</text>
    <g stroke="#1e2a44" stroke-width="2.5" fill="#fff">
      <rect x="1462" y="616" width="48" height="36" rx="4"/>
      <path d="M1462 616 l24 20 24 -20" fill="none"/>
    </g>
  </g>

  <!-- drop from band 2 to band 3 -->
  <path d="M1428 676 q30 70 -70 104" fill="none" stroke="#1e2a44" stroke-width="6" marker-end="url(#arr)"/>

  <!-- ===================== BAND 3 : HUMAN CONTROL ===================== -->
  <rect x="40" y="714" width="1520" height="252" rx="8" fill="url(#band3)"/>
  <line x1="60" y1="738" x2="1545" y2="738" stroke="#9aa4bd" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="62" y="716" width="196" height="40" rx="20" fill="#e2f3e4" stroke="#1e2a44" stroke-width="3"/>
  <text x="160" y="744" font-size="21" font-weight="bold" letter-spacing="2" fill="#1e2a44" text-anchor="middle">HUMAN CONTROL</text>

  <!-- 8. Blind 3-reviewer quorum -->
  <g>
    <rect x="82" y="782" width="404" height="160" rx="6" fill="#fdfff9" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="104" y="824" font-size="26" font-weight="bold" fill="#1e2a44">8. Blind 3-reviewer quorum</text>
    <g stroke="#1e2a44" stroke-width="3" fill="#fff">
      <circle cx="146" cy="890" r="24"/><circle cx="212" cy="890" r="24"/><circle cx="278" cy="890" r="24"/>
    </g>
    <g fill="#1e2a44">
      <circle cx="138" cy="884" r="3"/><circle cx="154" cy="884" r="3"/>
      <circle cx="204" cy="884" r="3"/><circle cx="220" cy="884" r="3"/>
      <circle cx="270" cy="884" r="3"/><circle cx="286" cy="884" r="3"/>
    </g>
    <g stroke="#1e2a44" stroke-width="2.5" fill="none">
      <path d="M138 898 q8 6 16 0"/><path d="M204 898 q8 6 16 0"/><path d="M270 898 q8 6 16 0"/>
    </g>
    <text x="318" y="874" font-size="17" fill="#3d4a66">accept / revise / reject</text>
    <text x="318" y="899" font-size="17" fill="#3d4a66">reveal after all submit</text>
  </g>
  <line x1="498" y1="862" x2="562" y2="862" stroke="#1e2a44" stroke-width="5" marker-end="url(#arr)"/>

  <!-- 9. Decision policy -->
  <g>
    <rect x="574" y="782" width="288" height="160" rx="6" fill="#fdfff9" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="596" y="824" font-size="26" font-weight="bold" fill="#1e2a44">9. Decision policy</text>
    <text x="596" y="858" font-size="18" fill="#3d4a66">majority + cooldown rules</text>
    <text x="596" y="883" font-size="18" fill="#3d4a66">owner receives reasons</text>
    <text x="596" y="908" font-size="18" fill="#3d4a66">every action is audited</text>
    <g stroke="#1e2a44" stroke-width="2.5" fill="#fff">
      <path d="M806 872 a12 12 0 0 1 10 -18 a14 14 0 0 1 26 2 a11 11 0 0 1 4 20 a10 10 0 0 1 -14 12 a12 12 0 0 1 -20 -6 a10 10 0 0 1 -6 -10 z"/>
      <circle cx="818" cy="868" r="2.2" fill="#1e2a44"/><circle cx="832" cy="868" r="2.2" fill="#1e2a44"/>
      <path d="M818 878 q7 5 14 0" fill="none"/>
    </g>
  </g>
  <line x1="874" y1="862" x2="938" y2="862" stroke="#1e2a44" stroke-width="5" marker-end="url(#arr)"/>

  <!-- 10. Lifecycle controller -->
  <g>
    <rect x="950" y="774" width="576" height="176" rx="6" fill="#fdfff9" stroke="#1e2a44" stroke-width="3.5"/>
    <text x="972" y="816" font-size="26" font-weight="bold" fill="#1e2a44">10. Lifecycle controller</text>
    <g stroke="#1e2a44" stroke-width="3" fill="#fff">
      <rect x="978" y="838" width="130" height="48" rx="24"/>
      <rect x="1180" y="838" width="120" height="48" rx="24"/>
      <rect x="1372" y="838" width="120" height="48" rx="24"/>
    </g>
    <text x="1043" y="869" font-size="19" fill="#1e2a44" text-anchor="middle">Candidate</text>
    <text x="1240" y="869" font-size="19" fill="#1e2a44" text-anchor="middle">Scouted</text>
    <text x="1432" y="869" font-size="19" fill="#1e2a44" text-anchor="middle">Verified</text>
    <line x1="1116" y1="862" x2="1168" y2="862" stroke="#1e2a44" stroke-width="6" marker-end="url(#arr)"/>
    <line x1="1308" y1="862" x2="1360" y2="862" stroke="#1e2a44" stroke-width="6" marker-end="url(#arr)"/>
    <text x="972" y="928" font-size="16.5" fill="#3d4a66">production routing &#183; freshness checks &#183; deprecate &#8594; archive &#183; ownership hand-off</text>
  </g>

  <!-- return loop -->
  <path d="M948 962 H420" fill="none" stroke="#1e2a44" stroke-width="4" stroke-dasharray="12 9"/>
  <path d="M420 962 q-46 -4 -50 -20" fill="none" stroke="#1e2a44" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arr)"/>
  <text x="980" y="982" font-size="17" fill="#54607c">fresh evidence and revised versions return for another fair scouting cycle</text>
</svg>
